version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Laravel Mix 6 (latest 6.0.49) cannot build with webpack >= 5.106.0:
      # the ProgressPlugin options schema changed and 5.107 removed
      # webpack/lib/SizeFormatHelpers. Keep webpack pinned at 5.105.4 until
      # the build moves off Laravel Mix.
      - dependency-name: "webpack"
        versions: [">=5.106.0"]
      # jQuery 4 removes $.isArray/$.isFunction/$.trim/$.type, which
      # jquery-datetimepicker 2.5.21 (#birthday in resources/js/jquery.js)
      # still calls.
      - dependency-name: "jquery"
        update-types: ["version-update:semver-major"]
